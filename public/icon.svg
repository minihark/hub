<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Accent Top Stripe -->
  <rect x="64" y="44" width="384" height="10" rx="5" fill="url(#accentGrad)" />

  <!-- Inner Badge Plate -->
  <rect x="80" y="80" width="352" height="352" rx="64" fill="#0A0E17" stroke="#1E2840" stroke-width="4" filter="url(#glow)" />

  <!-- Monogram H -->
  <!-- Left Pillar -->
  <rect x="156" y="148" width="52" height="216" rx="16" fill="url(#accentGrad)" />
  <!-- Right Pillar -->
  <rect x="304" y="148" width="52" height="216" rx="16" fill="url(#accentGrad)" />
  <!-- Crossbar -->
  <rect x="180" y="230" width="152" height="52" rx="12" fill="url(#accentGrad)" />

  <!-- Fleet Spark Pulse Dot -->
  <circle cx="340" cy="160" r="14" fill="#34D399" />
  <circle cx="340" cy="160" r="22" fill="none" stroke="#34D399" stroke-width="3" opacity="0.6" />
</svg>